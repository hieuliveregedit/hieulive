<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPLOCK DASHBOARD</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; border: 1px solid #333; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; text-align: center; }
        button { width: 95%; padding: 12px; margin: 5px 0; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #e50914; color: white; }
        .func-btn { background: #333; cursor: not-allowed; opacity: 0.5; }
        .active-btn { background: #28a745 !important; cursor: pointer !important; opacity: 1 !important; }
        .status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>VIPLOCK DASHBOARD</h2>
    
    <input type="text" id="keyInput" placeholder="DÁN KEY-XXXX-XXXX-XXXX">
    <button onclick="checkAndActivateKey()">KÍCH HOẠT (1 THIẾT BỊ)</button>

    <p id="statusMsg" class="status" style="color: #ff4d4d;">Trạng thái: Chưa kích hoạt Key</p>

    <hr style="border-color: #333; margin: 20px 0;">

    <h3>CHỨC NĂNG GAME</h3>
    <button id="btnAim" class="func-btn" onclick="toggleFunc('btnAim', 'Aimlock')">BẬT AIMLOCK (LOCK 99%)</button>
    <button id="btnHead" class="func-btn" onclick="toggleFunc('btnHead', 'Kéo Tâm Auto')">BẬT KÉO TÂM AUTO</button>
</div>

<script>
    // Điền thông tin Supabase của bạn
    const SUPABASE_URL = "https://aqaxmmpznarjntehxhaz.supabase.co";
    const SUPABASE_KEY = "SERVICE_ROLE_HOAC_ANON_KEY_CUA_BAN"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isActivated = false;

    async function checkAndActivateKey() {
        const keyVal = document.getElementById("keyInput").value.trim();
        const statusMsg = document.getElementById("statusMsg");

        if (!keyVal) {
            alert("Vui lòng nhập Key trước!");
            return;
        }

        statusMsg.innerText = "Đang kiểm tra Key...";
        statusMsg.style.color = "#ffc107";

        try {
            // Kiểm tra key trong bảng 'keys' trên Supabase
            const { data, error } = await _supabase
                .from('keys')
                .select('*')
                .eq('key', keyVal)
                .eq('status', 'active');

            if (data && data.length > 0) {
                isActivated = true;
                statusMsg.innerText = "Trạng thái: Đã Kích Hoạt Thành Công! ✅";
                statusMsg.style.color = "#28a745";

                // Mở khóa tất cả nút chức năng
                document.getElementById("btnAim").classList.add("active-btn");
                document.getElementById("btnHead").classList.add("active-btn");
                alert("Kích hoạt thành công! Các tác vụ Aimlock đã được mở khóa.");
            } else {
                statusMsg.innerText = "Trạng thái: Key không tồn tại hoặc đã hết hạn ❌";
                statusMsg.style.color = "#ff4d4d";
                alert("Key sai hoặc không tồn tại!");
            }
        } catch (err) {
            statusMsg.innerText = "Lỗi kết nối máy chủ!";
            console.error(err);
        }
    }

    function toggleFunc(btnId, funcName) {
        if (!isActivated) {
            alert("Bạn phải nhập Key chuẩn và bấm 'KÍCH HOẠT' thì mới dùng được nút này!");
            return;
        }

        const btn = document.getElementById(btnId);
        if (btn.innerText.includes("BẬT")) {
            btn.innerText = "TẮT " + funcName.toUpperCase();
            btn.style.background = "#dc3545";
            alert("Đã kích hoạt tác vụ: " + funcName);
        } else {
            btn.innerText = "BẬT " + funcName.toUpperCase();
            btn.style.background = "#28a745";
            alert("Đã tắt tác vụ: " + funcName);
        }
    }
</script>

</body>
</html>
