<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HieuLive Lock</title>
    <!-- THƯ VIỆN SUPABASE (BẮT BUỘC PHẢI CÓ DÒNG NÀY) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-title">
        <h2>PREMIUM MOBILE DASHBOARD</h2>
        <h1>HIEULIVE LOCK</h1>
    </div>

    <div class="container">
        <div class="card">
            <h3>HIEULIVE V4 API KEY</h3>
            <button onclick="resetInput()">Nhập lại</button>
            
            <div class="input-group">
                <label>MÃ KÍCH HOẠT</label>
                <input type="text" id="keyInput" placeholder="Nhập key của bạn..." value="HIEU123">
            </div>

            <button class="btn-activate" onclick="checkKey()">Kích hoạt (1 thiết bị)</button>

            <div class="input-group">
                <label>MÃ THIẾT BỊ (HWID)</label>
                <input type="text" id="hwidInput" value="67131251-0A5B-A422-87F7-5AC791F2799B" readonly>
            </div>

            <div id="statusMsg" class="status-error">Trạng thái: Chưa kích hoạt ❌</div>
        </div>

        <!-- CÁC TAB NỘI DUNG (BAN ĐẦU BỊ KHÓA) -->
        <div id="tab-func" class="tab-content active">
            <div class="card">
                <h3>Trang Tác Vụ Chính</h3>
                <p>Đã vượt qua lớp xác thực thành công! Chào mừng bạn đến với hệ thống.</p>
            </div>
        </div>
    </div>

    <!-- THANH MENU BÊN DƯỚI (ẨN BAN ĐẦU) -->
    <div class="bottom-nav hidden" id="bottomNav" style="display: none;">
        <button class="nav-btn" onclick="switchTab('home', this)">Trang chủ</button>
        <button class="nav-btn active" onclick="switchTab('func', this)">Tác vụ</button>
        <button class="nav-btn" onclick="logout()">Đăng xuất</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
