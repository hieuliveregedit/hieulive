<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kích Hoạt Key</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        #statusMsg {
            margin-top: 15px;
            font-size: 14px;
        }
        .hidden {
            display: none !important;
        }
        #bottomNav {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }
        .nav-btn {
            background: #28a745;
            padding: 8px 15px;
            border-radius: 5px;
            color: white;
            border: none;
            cursor: pointer;
        }
        .tab-content {
            display: none;
            margin-top: 20px;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Đăng Nhập Key</h2>
        
        <!-- Ô nhập key, đúng id="keyInput" để JS đọc -->
        <input type="text" id="keyInput" placeholder="Nhập mã key của bạn...">
        
        <!-- Nút bấm kích hoạt gọi hàm checkKey() -->
        <button onclick="checkKey()">Kích Hoạt</button>
        
        <p id="statusMsg">Trạng thái: Chưa nhập Key</p>

        <!-- Thanh điều hướng ẩn, khi đúng key sẽ hiện lên -->
        <div id="bottomNav" class="hidden">
            <button class="nav-btn" onclick="switchTab('home', this)">Trang Chủ</button>
            <button class="nav-btn" onclick="switchTab('tool', this)">Công Cụ</button>
        </div>

        <!-- Nội dung các tab -->
        <div id="tab-home" class="tab-content">
            <h3>Chào mừng mày đã vào được trang chính! 🎉</h3>
        </div>
        <div id="tab-tool" class="tab-content">
            <h3>Khu vực tính năng và công cụ VIP! 🚀</h3>
        </div>
    </div>

    <!-- Nhúng file script.js vào -->
    <script src="script.js"></script>
</body>
</html>
